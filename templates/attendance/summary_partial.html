<div class="bg-white rounded-2xl shadow-card border border-slate-200/80 p-6 h-full flex flex-col justify-between">
    <div>
        <div class="flex items-center space-x-3 mb-6 pb-4 border-b border-slate-100">
            <div class="h-9 w-9 rounded-xl bg-teal-50 text-teal-600 flex items-center justify-center border border-teal-100 shrink-0">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
            </div>
            <h3 class="text-base font-bold font-serif text-slate-900">Attendance Summary</h3>
        </div>
        
        <div class="flex flex-col items-center justify-center mb-6">
            <div class="relative w-28 h-28 flex items-center justify-center rounded-full border-4 {% if attendance_percentage >= 75 %}border-brand-teal text-brand-teal bg-teal-50/50{% elif attendance_percentage >= 50 %}border-amber-400 text-amber-600 bg-amber-50/50{% else %}border-brand-rust text-brand-rust bg-red-50/50{% endif %}">
                <span class="text-2xl font-mono font-bold">{{ attendance_percentage }}%</span>
            </div>
            <p class="text-xs text-slate-500 mt-3 font-medium">Present for <span class="font-mono font-bold text-slate-900">{{ total_days }}</span> recorded sessions</p>
        </div>
    </div>

    <div>
        <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3 pb-2 border-b border-slate-100">Recent Absences</h4>
        <ul class="space-y-2">
            {% for absence in recent_absences %}
            <li class="flex items-center text-xs font-medium text-slate-600">
                <span class="w-2 h-2 rounded-full bg-brand-rust mr-2 shrink-0"></span>
                <span class="font-mono">{{ absence.date|date:"F j, Y" }}</span>
            </li>
            {% empty %}
            <li class="text-xs text-slate-400 italic">No recent absences recorded.</li>
            {% endfor %}
        </ul>
    </div>
</div>
