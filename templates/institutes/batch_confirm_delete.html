{% extends 'base.html' %}
{% block title %}Delete Batch | Trakvo{% endblock %}
{% block content %}
<div class="p-4 sm:p-6 lg:p-8 min-h-[calc(100vh-4rem)] flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-200/80 p-6 sm:p-8 text-center space-y-5">
        <div class="mx-auto flex items-center justify-center h-14 w-14 rounded-full bg-red-50 text-brand-rust border border-red-200/80">
            <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
        </div>

        <div class="space-y-1.5">
            <h2 class="text-xl font-bold font-serif text-slate-900">Delete Batch</h2>
            <p class="text-xs sm:text-sm text-slate-500">Are you sure you want to delete the batch "<strong class="text-slate-900 font-semibold">{{ object.name }}</strong>"? This action cannot be undone.</p>
        </div>
        
        <form method="post" class="flex items-center justify-center space-x-3 pt-2">
            {% csrf_token %}
            <a href="{% url 'institutes:batch_list' %}" class="w-1/2 py-2.5 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs rounded-xl transition-colors">
                Cancel
            </a>
            <button type="submit" class="w-1/2 py-2.5 px-4 bg-brand-rust hover:bg-red-700 text-white font-semibold text-xs rounded-xl transition-colors shadow-xs">
                Delete Batch
            </button>
        </form>
    </div>
</div>
{% endblock %}
