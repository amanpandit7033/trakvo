{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Suspended | Trakvo</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-8 text-center space-y-4 border border-slate-200">
        <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        </div>
        <h2 class="text-xl font-bold text-slate-900 font-serif">Scoreboard Unavailable</h2>
        <p class="text-sm text-slate-600">Access to <strong class="text-slate-900">{{ institute.name }}</strong> scoreboard has been temporarily suspended.</p>
        <p class="text-xs text-slate-400">Please contact the institute administrator for further assistance.</p>
    </div>
</body>
</html>
